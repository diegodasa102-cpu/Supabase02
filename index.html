
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product CRUD</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>Product CRUD</h1>

  <!-- Cadastro -->
  <form id="add-product-form">
    <h2>Add Product</h2>

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="price">Price:</label>
    <input type="number" id="price" name="price" step="0.01" required>

    <label for="description">Description:</label>
    <textarea id="description" name="description" required></textarea>

    <button type="submit">Add Product</button>
  </form>

  <!-- Consulta por ID -->
  <form id="search-product-form">
    <h2>Search Product by ID</h2>

    <label for="search-id">Product ID:</label>
    <input type="number" id="search-id" required>

    <button type="submit" class="search-button">
      Search
    </button>

    <div id="search-result"></div>
  </form>

  <!-- Atualização -->
  <form id="update-product-form">
    <h2>Update Product</h2>

    <label for="update-id">Product ID:</label>
    <input type="number" id="update-id" required readonly>

    <label for="update-name">Name:</label>
    <input type="text" id="update-name" required>

    <label for="update-price">Price:</label>
    <input type="number" id="update-price" step="0.01" required>

    <label for="update-description">Description:</label>
    <textarea id="update-description" required></textarea>

    <button type="submit">Update Product</button>
  </form>

  <!-- Lista de produtos -->
  <h2>Registered Products</h2>

  <ul id="products"></ul>

</div>

<script src="app.js"></script>

</body>
</html>
